
# Se busca el .env en dos lugares porque IntelliJ puede arrancar desde ImprentaRios o desde imprenta-backend
spring.config.import=optional:file:.env[.properties],optional:file:imprenta-backend/.env[.properties]

server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/imprenta}

spring.data.mongodb.auto-index-creation=true

# JWT
jwt.secret=${APP_JWT_SECRET}
jwt.expiration=${APP_JWT_EXPIRATION_MS:28800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Usuarios que se crean al arrancar si no existen
app.admin.usuario=${APP_ADMIN_USUARIO:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}
app.secretaria.usuario=${APP_SECRETARIA_USUARIO:secretaria}
app.secretaria.password=${APP_SECRETARIA_PASSWORD:}
app.secretaria.nombre=${APP_SECRETARIA_NOMBRE:Secretaria de pruebas}
